services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [identity-private]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: kratos
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos -d kratos"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  kratos:
    image: oryd/kratos:v26.2.0
    restart: unless-stopped
    command: serve -c /etc/config/kratos/kratos.yml --dev=false
    networks: [identity-private]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    environment:
      DSN: postgres://kratos:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      SERVE_PUBLIC_BASE_URL: https://${DOMAIN_PORTAL}/.kratos
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN_PORTAL}/
      SELFSERVICE_ALLOWED_RETURN_URLS_0: https://${DOMAIN_PORTAL}
      SELFSERVICE_ALLOWED_RETURN_URLS_1: https://${DOMAIN_PORTAL}/*
      SELFSERVICE_ALLOWED_RETURN_URLS_2: https://${DOMAIN_AUTH}
      SELFSERVICE_ALLOWED_RETURN_URLS_3: https://${DOMAIN_AUTH}/*
      SELFSERVICE_FLOWS_LOGIN_UI_URL: https://${DOMAIN_PORTAL}/login
      SELFSERVICE_FLOWS_LOGIN_AFTER_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN_PORTAL}/
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: https://${DOMAIN_PORTAL}/registration
      SELFSERVICE_FLOWS_REGISTRATION_AFTER_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN_PORTAL}/
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: https://${DOMAIN_PORTAL}/settings
      SELFSERVICE_FLOWS_SETTINGS_AFTER_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN_PORTAL}/settings
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: https://${DOMAIN_PORTAL}/recovery
      SELFSERVICE_FLOWS_RECOVERY_AFTER_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN_PORTAL}/
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: https://${DOMAIN_PORTAL}/verification
      SELFSERVICE_FLOWS_VERIFICATION_AFTER_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN_PORTAL}/
      SELFSERVICE_FLOWS_ERROR_UI_URL: https://${DOMAIN_PORTAL}/error
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN_PORTAL}/login
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_PROVIDER: github
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_ID: github
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID: ${GITHUB_CLIENT_ID}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_MAPPER_URL: file:///etc/config/kratos/oidc.github.jsonnet
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_SCOPES_0: openid
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_SCOPES_1: email
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_SCOPES_2: profile
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_ALLOWED_REDIRECT_URIS_0: https://${DOMAIN_PORTAL}/oidc/callback
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_PROVIDER: discord
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_ID: discord
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_ID: ${DISCORD_CLIENT_ID}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_MAPPER_URL: file:///etc/config/kratos/oidc.discord.jsonnet
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_SCOPES_0: openid
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_SCOPES_1: email
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_SCOPES_2: identify
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_ALLOWED_REDIRECT_URIS_0: https://${DOMAIN_PORTAL}/oidc/callback
      KRATOS_SECRETS_COOKIE_0: ${KRATOS_COOKIE_SECRET}
      KRATOS_SECRETS_CIPHER_0: ${KRATOS_CIPHER_SECRET}
      SELFSERVICE_SESSION_COOKIE_DOMAIN: ${DOMAIN_PORTAL}
      COURIER_SMTP_CONNECTION_URI: ${SMTP_CONNECTION_URI}
      COURIER_SMTP_FROM_ADDRESS: noreply@${DOMAIN}
      LOG_LEVEL: info
      LOG_FORMAT: json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4434/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  hydra:
    image: oryd/hydra:v26.2.0
    restart: unless-stopped
    command: serve -c /etc/config/hydra/hydra.yml all --dev=false
    networks: [identity-private]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/hydra:/etc/config/hydra:ro
    environment:
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4445/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [identity-private]
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      SELF_URL: https://${DOMAIN_PORTAL}
      HYDRA_ISSUER_URL: https://${DOMAIN_AUTH}
      COOKIE_SECRET: ${PORTAL_COOKIE_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DOMAIN_PORTAL: ${DOMAIN_PORTAL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    networks: [identity-private]
    dns: 1.1.1.1
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      portal:
        condition: service_healthy
      hydra:
        condition: service_healthy

networks:
  identity-private:
    internal: true

volumes:
  postgres_data:

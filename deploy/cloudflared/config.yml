# Cloudflare Tunnel ingress map — REFERENCE ONLY.
#
# This stack runs cloudflared in remote-managed mode
# (`cloudflared tunnel run --token=...`), so this file is NOT used at runtime.
# Configure the same routing in the Cloudflare dashboard instead:
#   Networking > Tunnels > <tunnel> > Public Hostname.
#
# Docs: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/

tunnel: ${TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

# Route map (mirror these rules in the dashboard's Public Hostname tab):
#   ${AUTH_DOMAIN}/oauth2/*, /.well-known/*, /api/*  -> backend (OIDC/API)
#   ${AUTH_DOMAIN}/*                                  -> www (frontend portal)
#   ${ROOT_DOMAIN}/.well-known/webfinger              -> backend
#
# Order matters: cloudflared uses the first matching rule.
ingress:
  # OIDC / API / WebFinger on the auth domain -> backend
  - hostname: ${AUTH_DOMAIN}
    path: /oauth2*
    service: http://backend:3000
  - hostname: ${AUTH_DOMAIN}
    path: /.well-known*
    service: http://backend:3000
  - hostname: ${AUTH_DOMAIN}
    path: /api*
    service: http://backend:3000

  # WebFinger on the root domain -> backend
  - hostname: ${ROOT_DOMAIN}
    path: /.well-known/webfinger
    service: http://backend:3000

  # Frontend portal (catch-all for the auth domain) -> www
  - hostname: ${AUTH_DOMAIN}
    service: http://www:3001

  # Catch-all rule (required)
  - service: http_status:404
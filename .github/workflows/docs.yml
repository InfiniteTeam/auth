name: Deploy Docs

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.3.4'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate package API docs
        run: pnpm run docs

      - name: Build docs site
        run: pnpm --filter @inftkr/docs build

      - name: Verify static export
        run: test -f apps/docs/out/index.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs/out
          force_orphan: true
          publish_branch: gh-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/out --project-name=inft-auth-docs
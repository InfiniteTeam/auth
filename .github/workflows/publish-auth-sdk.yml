name: Publish auth-sdk

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@infiniteteam'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @infiniteteam/auth-sdk... build
      - run: pnpm --filter @infiniteteam/auth-sdk test
      - run: pnpm --filter @infiniteteam/auth-sdk publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

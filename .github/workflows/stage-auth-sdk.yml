name: Publish auth-sdk on npm

on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/auth-sdk/package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inftkr/auth-sdk... build
      - run: pnpm --filter @inftkr/auth-sdk test
      - run: pnpm --filter @inftkr/auth-sdk publish --no-git-checks --access public

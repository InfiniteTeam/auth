name: Publish auth-sdk on npm

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inftkr/auth-sdk... build
      - run: pnpm --filter @inftkr/auth-sdk test
      - run: pnpm --filter @inftkr/auth-sdk publish --no-git-checks --access public

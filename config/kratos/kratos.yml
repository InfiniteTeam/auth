version: v1.2.0

dsn: ""

serve:
  public:
    port: 4433
    host: 0.0.0.0
    cors:
      enabled: true
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Set-Cookie
      allow_credentials: true
      max_age: 3600
  admin:
    port: 4434
    host: 0.0.0.0

selfservice:
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
    oidc:
      enabled: true
      config:
        providers: []
    code:
      enabled: false

  flows:
    settings:
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      use: code
      lifespan: 1h

    verification:
      enabled: true
      use: code
      lifespan: 1h

    login:
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: require_verified_address

    registration:
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

log:
  level: info
  format: json

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

session:
  cookie:
    same_site: Lax
    name: ory_kratos_session
    persistent: true
    path: /
    secure: true
  whoami:
    required_aal: highest_available
  lifespan: 720h

courier:
  templates:
    recovery:
      valid:
        body: file:///etc/config/kratos/templates/recovery/valid.twig
      invalid:
        body: file:///etc/config/kratos/templates/recovery/invalid.twig
    verification:
      valid:
        body: file:///etc/config/kratos/templates/verification/valid.twig
      invalid:
        body: file:///etc/config/kratos/templates/verification/invalid.twig

serve:
  public:
    port: 4444
    host: 0.0.0.0
  admin:
    port: 4445
    host: 0.0.0.0
  cookies:
    same_site_mode: Lax

dsn: postgres://hydra:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4

urls:
  self:
    issuer: https://auth.inft.kr
  consent: https://id.inft.kr/oauth2/consent
  login: https://id.inft.kr/oauth2/login
  logout: https://id.inft.kr/oauth2/logout
  error: https://id.inft.kr/error

secrets:
  system:
    - ${HYDRA_SYSTEM_SECRET}

oidc:
  subject_identifiers:
    supported_types:
      - public
  dynamic_client_registration:
    enabled: false

oauth2:
  hashers:
    bcrypt:
      cost: 12
  session:
    encrypt_at_rest: false

webfinger:
  oidc_discovery:
    supported_claims:
      - email
      - email_verified
      - name
      - given_name
      - family_name
      - picture
      - locale
      - groups
      - role
    supported_scope:
      - openid
      - offline
      - offline_access
      - email
      - profile
    userinfo_url: https://auth.inft.kr/oauth2/userinfo
    token_url: https://auth.inft.kr/oauth2/token
    jwks_url: https://auth.inft.kr/.well-known/jwks.json

log:
  level: info
  format: json
  leak_sensitive_values: false
